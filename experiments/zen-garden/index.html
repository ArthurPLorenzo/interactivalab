<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jardim Zen — InteractivaLab</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <nav class="top-bar" id="topBar">
    <a href="/" class="back-btn">← InteractivaLab</a>
    <span class="experiment-title">🪨 Jardim Zen</span>
  </nav>

  <div class="workspace">
    <!-- Toolbar -->
    <div class="toolbar" id="toolbar">
      <span class="toolbar-label">Rastelo</span>

      <div class="rake-group">
        <button class="rake-btn active" data-rake="thin"   title="Fino">|||</button>
        <button class="rake-btn"        data-rake="medium" title="Médio">|||||</button>
        <button class="rake-btn"        data-rake="wide"   title="Largo">|||||||</button>
      </div>

      <div class="toolbar-spacer"></div>

      <button class="btn btn--ghost" id="btnSilence">🌿 Silêncio</button>
      <button class="btn btn--ghost" id="btnReset">↺ Resetar</button>
    </div>

    <!-- Garden frame -->
    <div class="garden-frame">
      <canvas id="zenCanvas"></canvas>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
